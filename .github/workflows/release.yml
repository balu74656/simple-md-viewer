name: release

# Instalator se stavi z tagu, zvlast pro ARM64 a x64. Dve cesty k vydani:
#  - Actions -> release -> Run workflow (na main): verze se vezme z package.json,
#    workflow sam vytvori tag v<verze> na aktualnim main a postavi instalatory.
#  - Push tagu v* rucne (puvodni postup), napr. git tag -a v0.5.1 && git push origin v0.5.1
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Urci tag a commit, ze ktereho se stavi. Pri rucnim spusteni tag vytvori.
  # Tag pushnuty pres GITHUB_TOKEN nespousti dalsi workflow, takze build
  # nepobezi dvakrat.
  tag:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.tag.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Tag z pushe
        if: github.event_name == 'push'
        run: echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Vytvorit tag podle package.json
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Rucni vydani jen z vetve main (spusteno z $GITHUB_REF_NAME)."
            exit 1
          fi
          TAG="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG uz existuje. Zvedni verzi (npm run set-version), nebo smaz stary tag a Release."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "MD Viewer $TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - id: tag
        run: |
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Vydava se $TAG z commitu $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.arch }}
    needs: tag

    strategy:
      # Oba joby zakladaji tentyz Release. Paralelne by se o nej prali,
      # serazene za sebou druhy jen prida svuj instalator k existujicimu.
      max-parallel: 1
      # Kdyz spadne jedna architektura, druhy instalator at je stejne k dispozici.
      fail-fast: false
      # Poradi v include = poradi buildu (max-parallel: 1). ARM64 jde prvni,
      # autor ho pouziva sam a chce ho mit driv.
      matrix:
        include:
          - runner: windows-11-arm
            arch: arm64
          - runner: windows-latest
            arch: x64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Cache je per architektura, jinak by si joby prepisovaly artefakty
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.arch }}

      - run: npm ci

      # Typova kontrola zvlast, at je pri chybe hned jasne, co selhalo
      - run: npx tsc --noEmit

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # VITE_PLANTUML_SERVER zde zamerne chybi - verejny instalator
          # startuje s prazdnym polem a server se doplni v Nastaveni.
        with:
          tagName: ${{ needs.tag.outputs.name }}
          releaseName: MD Viewer ${{ needs.tag.outputs.name }}
          releaseBody: |
            Instalátory pro Windows — vyber podle architektury procesoru:

            - **x64** (Intel / AMD) — `MD.Viewer_*_x64-setup.exe`
            - **ARM64** (Snapdragon a spol.) — `MD.Viewer_*_arm64-setup.exe`

            Když si nejsi jistý, v PowerShellu: `$env:PROCESSOR_ARCHITECTURE`
            → `AMD64` = x64, `ARM64` = ARM64.

            Instalátory nejsou podepsané certifikátem, takže SmartScreen
            upozorní na neznámého vydavatele — **Další informace → Přesto spustit**.

            Po instalaci: pravý klik na `.md` → Otevřít v programu → MD Viewer
            → Vždy používat tuto aplikaci.

            Změny v [CHANGELOG.md](https://github.com/balu74656/simple-md-viewer/blob/main/CHANGELOG.md).
          releaseDraft: false
          prerelease: false
